<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Z.O.R.K Zombie Outbreak Remenants of Kin</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="mobile-scummvm.css" />
  <link rel="stylesheet" href="mobile-9x16.css" />
  <link rel="stylesheet" href="verb-ui.css" />
</head>
<body>
  <main id="game-root">
    <section id="canvas-wrapper">
      <canvas id="render-canvas"></canvas>
    </section>

    <section id="ui-overlay">
      <aside class="panel status-bar">
        <div class="status-row">
          <span>Room:</span>
          <strong id="room-name">Loading</strong>
        </div>
        <div class="status-row">
          <span>Noise:</span>
          <strong id="noise-meter">0</strong>
        </div>
        <div class="status-row">
          <span>Threat:</span>
          <strong id="threat-state">dormant</strong>
        </div>
        <div class="status-row player-health-row">
          <span>Health:</span>
          <strong id="player-health">100/100</strong>
        </div>
      </aside>

      <aside id="inventory-panel" class="panel">
        <h2>Inventory</h2>
        <div id="inventory-grid" class="inventory-grid"></div>
      </aside>

      <aside id="narrator-panel" class="panel">
        <p id="narrator-text" class="narrator-text">
          Z.O.R.K. is loading. Something outside still thinks it owns the street.
        </p>
        <div id="choice-buttons" class="choice-buttons"></div>
      </aside>
    </section>
  </main>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js"
      }
    }
  </script>
  <script type="module" src="game.js?v=zork-title-1"></script>
  <script src="zork-polish-patch.js?v=1"></script>
  <script src="mobile-follow-camera.js?v=1"></script>
  <script src="walking-transition.js?v=1"></script>
  <script src="verb-ui.js?v=1"></script>
  <script src="verb-interactions.js?v=1"></script>
</body>
</html>
